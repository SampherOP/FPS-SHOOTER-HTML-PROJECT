name: Restore gameplay controls
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[controls-fixed]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore known-good game and switch slide to X
        run: |
          git checkout 88df0d0dce2d2fb670719780933ad7db5710df8a -- krunker-clone/game.js
          python - <<'PY'
          from pathlib import Path
          p=Path('krunker-clone/game.js')
          s=p.read_text(encoding='utf-8')
          old=s
          s=s.replace("ControlLeft", "KeyX").replace("ControlRight", "KeyX")
          s=s.replace("e.key==='Control'", "e.key==='x'")
          s=s.replace("e.key === 'Control'", "e.key === 'x'")
          s=s.replace("e.code==='Control'", "e.code==='KeyX'")
          s=s.replace("e.code === 'Control'", "e.code === 'KeyX'")
          p.write_text(s, encoding='utf-8')
          if s == old:
              print('No generic Control binding found; known-good game restored.')
          PY
      - name: Commit fixed game
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add krunker-clone/game.js
          git commit -m "Restore working menu and set slide to X [controls-fixed]" || exit 0
          git push
