name: Patch FPS gameplay
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-fps.yml'
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game.js
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('krunker-clone/game.js')
          s=p.read_text()
          new_hands="""function addViewHands(){
            const skin=mat(0xb87858,.82,.02),sleeve=mat(0x252b30,.86,.03),glove=mat(0x9d6b4d,.72,.04);
            const rig=new T.Group();rig.name='TWO_HAND_RIG';
            function seg(a,b,r,m){const v=new T.Vector3().subVectors(b,a),g=new T.Group();const mesh=new T.Mesh(new T.CylinderGeometry(r,r,v.length(),8),m);mesh.position.copy(a).add(b).multiplyScalar(.5);mesh.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),v.normalize());g.add(mesh);return g}
            const rElbow=new T.Vector3(.28,-.40,.10),rWrist=new T.Vector3(.03,-.235,-.02);
            const lElbow=new T.Vector3(-.30,-.39,.10),lWrist=new T.Vector3(-.10,-.015,-.50);
            rig.add(seg(rElbow,rWrist,.075,sleeve));rig.add(seg(lElbow,lWrist,.075,sleeve));
            const handR=new T.Mesh(new T.SphereGeometry(.105,12,8),skin);handR.scale.set(1,.85,1.25);handR.position.set(.015,-.215,-.065);handR.name='RIGHT_GRIP_HAND';
            const handL=new T.Mesh(new T.SphereGeometry(.105,12,8),skin);handL.scale.set(1,.82,1.3);handL.position.set(-.095,-.015,-.53);handL.name='LEFT_SUPPORT_HAND';
            const wrapR=new T.Mesh(new T.TorusGeometry(.09,.025,7,12,Math.PI*1.35),glove);wrapR.rotation.x=Math.PI/2;wrapR.position.set(.01,-.22,-.08);
            const wrapL=new T.Mesh(new T.TorusGeometry(.09,.025,7,12,Math.PI*1.35),glove);wrapL.rotation.x=Math.PI/2;wrapL.position.set(-.095,-.015,-.53);
            rig.add(handR,handL,wrapR,wrapL);viewGun.add(rig);return rig
          }"""
          s,n=re.subn(r"function addViewHands\(\).*?\nfunction rebuildViewWeapon",new_hands+"\nfunction rebuildViewWeapon",s,count=1,flags=re.S);assert n==1,'addViewHands not found'
          new_hits="""function hitscan(origin,dir,w,owner){
            const ray=new T.Raycaster(origin,dir,0,w.range);
            if(owner===player){
              if(!enemy?.alive)return false;enemy.mesh.updateMatrixWorld(true);
              const targets=[];enemy.mesh.traverse(o=>{if(o.isMesh&&(o.name==='HEAD_HITBOX'||o.name==='BODY_HITBOX'))targets.push(o)});
              const hits=ray.intersectObjects(targets,false);
              if(hits.length){
                const enemyHit=hits[0],worldHits=ray.intersectObjects(world.map(o=>o.mesh),false);
                if(worldHits.length&&worldHits[0].distance<enemyHit.distance-.01)return false;
                const head=enemyHit.object.userData.hitZone==='head',dmg=head?w.headDamage:w.damage;applyDamage(enemy,dmg,player,head);hitMarker(head);return true
              }
            }else{
              const pbox=new T.Mesh(new T.BoxGeometry(.9,2.2,.7));pbox.position.set(player.pos.x,player.pos.y-.65,player.pos.z);pbox.updateMatrixWorld();
              const hit=ray.intersectObject(pbox,false)[0];
              if(hit){const worldHits=ray.intersectObjects(world.map(o=>o.mesh),false);if(!worldHits.length||worldHits[0].distance>hit.distance-.01)applyDamage(player,w.damage,enemy,false)}
            }return false
          }"""
          s,n=re.subn(r"function hitscan\(origin,dir,w,owner\).*?\nfunction hitMarker",new_hits+"\nfunction hitMarker",s,count=1,flags=re.S);assert n==1,'hitscan not found'
          new_shoot="""function shoot(){
            if(!player.alive||phase!=='fight'||reloadT>0||shootCD>0)return;const w=weapons[weaponIndex],a=ammo[weaponIndex];if(a.m<=0){reload();return}
            a.m--;shootCD=1/w.rate;fireAnimT=.16;initAudio();gunSound(w.sound);muzzleFlash();const o=camera.position.clone(),base=aimAssist(forward());
            for(let i=0;i<(w.pellets||1);i++){const d=base.clone();d.x+=(Math.random()-.5)*w.spread;d.y+=(Math.random()-.5)*w.spread;d.z+=(Math.random()-.5)*w.spread;tracer(d.normalize());if(enemy?.alive)hitscan(o,d,w,player);if(!enemy?.alive)break}
            pitch=Math.max(-1.3,pitch+w.recoil*(aiming?.55:1));viewGun.position.z=-.68;setTimeout(()=>viewGun.position.z=-.78,60);updateHUD()
          }"""
          s,n=re.subn(r"function shoot\(\).*?\nfunction reload",new_shoot+"\nfunction reload",s,count=1,flags=re.S);assert n==1,'shoot not found'
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add krunker-clone/game.js
          git diff --cached --quiet || git commit -m 'Fix cover collision recoil and FPS hand grip [skip ci]'
          git push
