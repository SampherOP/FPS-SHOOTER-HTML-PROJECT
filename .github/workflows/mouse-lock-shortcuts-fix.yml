name: Mouse Lock Shortcut Fix

on:
  push:
    paths:
      - '.github/workflows/mouse-lock-shortcuts-fix.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch game.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('krunker-clone/game.js')
          s=p.read_text(encoding='utf-8')
          marker='/* HAMU_MOUSE_LOCK_SHORTCUT_FIX */'
          if marker not in s:
              patch=r'''

/* HAMU_MOUSE_LOCK_SHORTCUT_FIX */
(()=>{
  const canvas=document.getElementById('game');
  if(!canvas)return;

  document.addEventListener('keydown',e=>{
    if(e.code==='Backquote'){
      e.preventDefault();
      e.stopPropagation();
      if(document.pointerLockElement===canvas) document.exitPointerLock?.();
      else canvas.requestPointerLock?.();
      return;
    }

    if(document.pointerLockElement!==canvas)return;

    const browserShortcut=(e.ctrlKey||e.metaKey||e.altKey||e.key==='F5'||e.key==='F6'||e.key==='F11'||e.key==='F12');
    if(browserShortcut){
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
    }
  },true);

  document.addEventListener('contextmenu',e=>{
    if(document.pointerLockElement===canvas)e.preventDefault();
  },true);
})();
'''
              s += patch
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add krunker-clone/game.js
          git diff --cached --quiet || git commit -m 'Add backquote mouse lock toggle and block browser shortcuts'
          git push
