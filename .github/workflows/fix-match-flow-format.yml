name: Fix Match Flow Patch Formatting

on:
  push:
    paths:
      - 'krunker-clone/game.js'
      - '.github/workflows/fix-match-flow-format.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[match-flow-format]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize injected JavaScript newlines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('krunker-clone/game.js')
          s=p.read_text(encoding='utf-8')
          marker='/* HAMU_MATCH_FLOW_EMOTES_V1 */'
          if marker not in s:
              print('marker not found')
              raise SystemExit(0)
          before, tail=s.split(marker,1)
          fixed_tail=tail.replace('\\n','\n')
          if fixed_tail == tail:
              print('already normalized')
              raise SystemExit(0)
          p.write_text(before+marker+fixed_tail,encoding='utf-8')
          PY
      - name: Commit formatting fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add krunker-clone/game.js
          git diff --cached --quiet || git commit -m 'Fix match flow JavaScript formatting [match-flow-format]'
          git push
