name: Set Slide To X
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-slide:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[slide-x]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change only slide key from Ctrl to X
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('krunker-clone/game.js')
          s = p.read_text(encoding='utf-8')
          old = s
          replacements = {
              "e.code==='ControlLeft'": "e.code==='KeyX'",
              "e.code==='ControlRight'": "e.code==='KeyX'",
              'e.code==="ControlLeft"': 'e.code==="KeyX"',
              'e.code==="ControlRight"': 'e.code==="KeyX"',
              "e.code==='Control'": "e.code==='KeyX'",
              'e.code==="Control"': 'e.code==="KeyX"',
              "e.key==='Control'": "e.key==='x'",
              'e.key==="Control"': 'e.key==="x"',
              "e.key==='ctrl'": "e.key==='x'",
              'e.key==="ctrl"': 'e.key==="x"',
              "keys.ControlLeft": "keys.KeyX",
              "keys.ControlRight": "keys.KeyX",
              "keys.Control": "keys.KeyX",
          }
          for a,b in replacements.items():
              s = s.replace(a,b)
          if s == old:
              raise SystemExit('No Ctrl slide binding found; refusing to change unrelated code.')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Update controls hint
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('krunker-clone/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('CTRL Hold Slide','X Hold Slide')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add krunker-clone/game.js krunker-clone/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Set slide control to X [slide-x]'
          git push
